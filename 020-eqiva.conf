[[inputs.exec]]

commands = [
 "/root/srvstatus/bin/python3 /usr/local/bin/eqiva.py  00:1A:22:1C:4D:DC --dump --json"
]

interval = "60s"
timeout = "10s"
name_override = "equiva"
data_format = "json"
json_query='0.{mac,"temp_set":temperature.valueC,valve,"is_auto":mode.#[=="AUTO"]#|#,"is_vacation":mode.#[=="VACATION"]#|#,"is_boost":mode.#[=="BOOST"]#|#,"is_dst":mode.#[=="DAYLIGHT_SUMMER_TIME"]#|#,"is_open_window":mode.#[=="OPEN_WINDOW"]#|#,"is_battery_low":mode.#[=="BATTERY_LOW"]#|#}'
tag_keys = ["mac"]

